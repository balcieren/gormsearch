services:
  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      - MEILI_MASTER_KEY=masterKey
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=gormsearch_benchmark
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d gormsearch_benchmark"]
      interval: 5s
      timeout: 5s
      retries: 5

  benchmark-runner:
    build:
      context: ../..
      dockerfile: examples/docker-benchmark/Dockerfile
    environment:
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_API_KEY=masterKey
      - POSTGRES_DSN=host=postgres user=user password=password dbname=gormsearch_benchmark port=5432 sslmode=disable
    depends_on:
      meilisearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
